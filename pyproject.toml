[project]
name = "rythe"
dynamic = ["version"]
description = "A date/time-based personal journal: $EDITOR to write, a CLI for everything else."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dateparser>=1.2",
]

[project.scripts]
rythe = "rythe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is written once, in the package, so `rythe --version` and the built package agree.
[tool.hatch.version]
path = "src/rythe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rythe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
