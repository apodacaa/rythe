[project]
name = "journal"
version = "0.1.0"
description = "A date/time-based personal journal: a vim-modal TUI to write, a CLI for everything else."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
]

[project.scripts]
journal = "journal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
