[project]
name = "journal"
dynamic = ["version"]
description = "A date/time-based personal journal: $EDITOR to write, a CLI for everything else."
requires-python = ">=3.11"
dependencies = [
    "dateparser>=1.2",
]

[project.scripts]
journal = "journal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is written once, in the package, so `journal --version` and the built package agree.
[tool.hatch.version]
path = "src/journal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/journal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
